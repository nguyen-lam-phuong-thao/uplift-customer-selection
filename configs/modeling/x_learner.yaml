project:
  experiment_name: criteo-uplift-modeling

data:
  dataset_name: criteo
  processed_paths:
    visit: data/processed/criteo/criteo_decision_visit.parquet
    conversion: data/processed/criteo/criteo_decision_conversion.parquet

training:
  train_split: train
  validation_split: validation
  prediction_batch_size: 500000
  early_stopping_rounds: 100
  log_evaluation_period: 50

model:
  name: x_learner_lgbm

  params:
    objective: binary
    boosting_type: gbdt
    n_estimators: 5000
    learning_rate: 0.03
    num_leaves: 63
    max_depth: 8
    min_child_samples: 500
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    importance_type: gain
    verbosity: -1

outputs:
  prediction_dir: artifacts/predictions
  metric_dir: artifacts/metrics
  figure_dir: artifacts/figures
  prediction_splits:
    - validation

selection:
  primary_outcome: visit
  primary_split: validation
  primary_budget_fraction: 0.05
  primary_metric: policy_value
  baseline_policy: treated_response_lgbm

tracking:
  log_predictions: false

